<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Tính liều</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #f8f9fa;
            color: #333;
            text-align: center;
        }
        .card {
            background: white;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            max-width: 420px;
            margin: 1rem;
        }
        h1 { color: #2196F3; margin-bottom: 0.5rem; font-size: 1.8rem; }
        p { color: #666; margin-bottom: 1.8rem; line-height: 1.5; }
        button {
            background: #2196F3;
            color: white;
            border: none;
            padding: 0.8rem 1.8rem;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:active { transform: scale(0.96); }
    </style>
</head>
<body>
    <div class="card">
        <h1>📶 Bạn đang offline</h1>
        <p>Ứng dụng <strong>Tính liều</strong> đang hoạt động ở chế độ ngoại tuyến. Vui lòng kết nối mạng để xem nội dung mới nhất.</p>
        <button onclick="window.location.reload()">Thử lại</button>
    </div>
</body>
</html>
